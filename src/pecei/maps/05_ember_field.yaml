# 05 ember field — fire + wood interaction. 10x10. ego(3,3)EAST -> goal(8,1).
# ego occupies (1,3)(2,3)(3,3) row3. Head NORTH to row1 where fire(3,1) ignites;
# a burning ego can burn through the wood wall at (5,1) instead of detouring.
width: 10
height: 10
goal: [8, 1]
entities:
  - name: ego
    anchor: [3, 3]
    orientation: EAST
    is_ego: true
    components:
      - { offset: [0, 0], type: brain }
  # fire cell directly above the ego's lane
  - name: fire1
    anchor: [3, 1]
    components:
      - { offset: [0, 0], type: fire }
  # wood wall blocking straight line to goal
  - name: wood1
    anchor: [5, 1]
    components:
      - { offset: [0, 0], type: wood }

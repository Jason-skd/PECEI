# 04 fire+wood — terrain interaction. 12x9. Single-cell ego (brain) faces EAST
# at (1,7). Goal at (10,4) is sealed inside a stone room: the only non-stone
# side is the LEFT wall, a 4-cell WOOD column at x=8 (rows 3-6). Stone is
# impassable, so the ONLY way in is to burn through the wood — which requires
# being ignited. Fire sits at (5,6) on the approach: the ego must steer to
# touch the fire, catch flame, then ram the wood wall while still burning to
# enter the goal room. Teaches: acquire fire, then exploit fire+wood.
width: 12
height: 9
goal: [10, 4]
entities:
  - name: ego
    anchor: [1, 7]
    orientation: EAST
    is_ego: true
    components:
      - { offset: [0, 0], type: brain }
  # fire cell on the approach to the wood wall — ignites the ego. Placed 2 steps
  # from the wood so BURN_DURATION=3 survives the run into the wall.
  - name: fire1
    anchor: [6, 6]
    components:
      - { offset: [0, 0], type: fire }
  # top stone wall (row 2, cols 8-11)
  - name: room_top
    anchor: [8, 2]
    components:
      - { offset: [0, 0], type: stone }   # (8,2)
      - { offset: [1, 0], type: stone }   # (9,2)
      - { offset: [2, 0], type: stone }   # (10,2)
      - { offset: [3, 0], type: stone }   # (11,2)
  # right stone wall (col 11, rows 2-7)
  - name: room_right
    anchor: [11, 2]
    components:
      - { offset: [0, 0], type: stone }   # (11,2)
      - { offset: [0, 1], type: stone }   # (11,3)
      - { offset: [0, 2], type: stone }   # (11,4)
      - { offset: [0, 3], type: stone }   # (11,5)
      - { offset: [0, 4], type: stone }   # (11,6)
      - { offset: [0, 5], type: stone }   # (11,7)
  # bottom stone wall (row 7, cols 8-11)
  - name: room_bot
    anchor: [8, 7]
    components:
      - { offset: [0, 0], type: stone }   # (8,7)
      - { offset: [1, 0], type: stone }   # (9,7)
      - { offset: [2, 0], type: stone }   # (10,7)
      - { offset: [3, 0], type: stone }   # (11,7)
  # left WOOD wall (col 8, rows 3-6) — the ONLY enterable side; must burn through
  - name: room_wood
    anchor: [8, 3]
    components:
      - { offset: [0, 0], type: wood }    # (8,3)
      - { offset: [0, 1], type: wood }    # (8,4)
      - { offset: [0, 2], type: wood }    # (8,5)
      - { offset: [0, 3], type: wood }    # (8,6)

# 01 corridor — baseline solvability. 10x6. Single-cell ego (brain) faces EAST
# at (3,3). Goal at (8,3). Straight east, no obstacles. Teaches: loop forward
# until goal.
width: 10
height: 6
goal: [8, 3]
entities:
  - name: ego
    anchor: [3, 3]
    orientation: EAST
    is_ego: true
    components:
      - { offset: [0, 0], type: brain }

# 07 forge crossing — mixed terrain gauntlet. 15x15. ego(2,1)EAST -> goal(12,12).
# Metal cluster at (5,1)-(6,2) blocks the top lane; fire at (7,1) ignites; wood
# pillars at column 10 with water at (10,6). Use burning to clear wood, stay dry
# before any metal contact.
width: 15
height: 15
goal: [12, 12]
entities:
  - name: ego
    anchor: [2, 1]
    orientation: EAST
    is_ego: true
    components:
      - { offset: [0, 0], type: brain }
  # metal cluster (L-shaped obstacle)
  - name: metal_cluster
    anchor: [5, 1]
    components:
      - { offset: [0, 0], type: metal }
      - { offset: [1, 0], type: metal }
      - { offset: [1, 1], type: metal }
  # fire on the main path
  - name: fire1
    anchor: [7, 1]
    components:
      - { offset: [0, 0], type: fire }
  # wooden pillars (burnable)
  - name: wood_pillar1
    anchor: [10, 1]
    components:
      - { offset: [0, 0], type: wood }
      - { offset: [0, 7], type: wood }
  # water for quenching / soaking
  - name: water1
    anchor: [10, 6]
    components:
      - { offset: [0, 0], type: water }

# 02 one wall — single detour with a dead-end trap. 12x8. Single-cell ego (brain)
# faces EAST at (1,5). Goal at (10,1). A stone wall at x=6 (rows 1-6) splits the
# field; the gap is at the TOP (row 0). The direct route east hits the wall and a
# naive "blocked→turn" wall-follower descends into the dead-end pocket at the
# bottom-right before finding the top gap — so the ego must recognise the dead
# end (via VISITED) and backtrack up to the gap. Teaches: detour + backtrack.
width: 12
height: 8
goal: [10, 1]
entities:
  - name: ego
    anchor: [1, 5]
    orientation: EAST
    is_ego: true
    components:
      - { offset: [0, 0], type: brain }
  # main wall splitting east/west; gap at top (row 0)
  - name: wall
    anchor: [6, 1]
    components:
      - { offset: [0, 0], type: stone }   # (6,1)
      - { offset: [0, 1], type: stone }   # (6,2)
      - { offset: [0, 2], type: stone }   # (6,3)
      - { offset: [0, 3], type: stone }   # (6,4)
      - { offset: [0, 4], type: stone }   # (6,5)
      - { offset: [0, 5], type: stone }   # (6,6)
      # gap at (6,0)
  # dead-end pocket wall — traps a greedy wall-follower that goes south
  - name: pocket
    anchor: [9, 6]
    components:
      - { offset: [0, 0], type: stone }   # (9,6)
      - { offset: [1, 0], type: stone }   # (10,6)
      - { offset: [2, 0], type: stone }   # (11,6)

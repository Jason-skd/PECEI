# 02 one wall — detour. 10x6. ego(1,3)EAST -> goal(8,2). Stone wall column blocks the
# east row; go around the top. Fires the branch/turning path.
width: 15
height: 10
goal: [14, 14]
entities:
  - name: ego
    anchor: [1, 1]
    orientation: EAST
    is_ego: true
    components:
      - { offset: [0, 0], type: wheel }
      - { offset: [1, 0], type: metal }
      - { offset: [2, 0], type: brain }
  - name: wall
    anchor: [5, 2]
    components:
      - { offset: [0, 0], type: stone }
      - { offset: [0, 1], type: stone }
      - { offset: [0, 2], type: stone }

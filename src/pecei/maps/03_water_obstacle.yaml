# 03 water obstacle — water is passable in MVP. 12x7. ego(1,5)EAST -> goal(10,1).
# A stone column at x=6 spans y1..5 with a WATER gap at (6,4); water is crossable,
# so the path dips through the water gap then resumes north.
width: 12
height: 7
goal: [10, 1]
entities:
  - name: ego
    anchor: [3, 5]
    orientation: EAST
    is_ego: true
    components:
      - { offset: [0, 0], type: wheel }
      - { offset: [0, 1], type: metal }
      - { offset: [0, 2], type: brain }
  - name: wall
    anchor: [6, 1]
    components:
      - { offset: [0, 0], type: stone }   # (6,1)
      - { offset: [0, 1], type: stone }   # (6,2)
      - { offset: [0, 2], type: stone }   # (6,3)
      # water gap at (6,4)
      - { offset: [0, 4], type: stone }   # (6,5)
  - name: gap
    anchor: [6, 4]
    components:
      - { offset: [0, 0], type: water }

# 04 maze — two staggered stone walls, blind exploration. 12x7. ego(1,5)EAST -> goal(10,1).
# Wall A at x=6 (gap at top y1); wall B at x=8 (gap at bottom y5). Route: up the left of A,
# through A's top gap, down the left of B, through B's bottom gap, up to goal.
width: 12
height: 7
goal: [10, 1]
entities:
  - name: ego
    anchor: [3, 5]
    orientation: EAST
    is_ego: true
    components:
      - { offset: [0, 0], type: brain }
  - name: wallA
    anchor: [6, 2]
    components:
      - { offset: [0, 0], type: stone }   # (6,2)
      - { offset: [0, 1], type: stone }   # (6,3)
      - { offset: [0, 2], type: stone }   # (6,4)
      - { offset: [0, 3], type: stone }   # (6,5)
      # gap at (6,1)
  - name: wallB
    anchor: [8, 1]
    components:
      - { offset: [0, 0], type: stone }   # (8,1)
      - { offset: [0, 1], type: stone }   # (8,2)
      - { offset: [0, 2], type: stone }   # (8,3)
      - { offset: [0, 3], type: stone }   # (8,4)
      # gap at (8,5)
